version: '3.8'

services:
  oghidra:
    build:
      context: .
      dockerfile: Dockerfile # This is the original Dockerfile for the Python app
    container_name: oghidra_app
    ports:
      - "8081:8081" # For ghidra_mcp_server.py in the oghidra app
    volumes:
      - .:/app
      - oghidra_data:/app/data
    env_file:
      - .env
    depends_on:
      - ollama
      - ghidra # Added dependency
    networks:
      - oghidra_net
    # CMD is in its Dockerfile

  ollama:
    image: ollama/ollama
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - oghidra_net

  ghidra:
    build:
      context: .
      dockerfile: Dockerfile.ghidra # New Dockerfile for Ghidra service
    container_name: ghidra_bridge_service # Renamed for clarity
    ports:
      - "18001:18001" # Exposing ghidra-bridge port
    volumes:
      - ghidra_projects:/opt/ghidra_projects # Example volume for Ghidra projects if Ghidra runs as root
      # If Ghidra runs as ghidrauser:
      # - ghidra_projects:/home/ghidrauser/ghidra_projects 
    networks:
      - oghidra_net
    # CMD is in Dockerfile.ghidra

volumes:
  ollama_data:
  oghidra_data:
  ghidra_projects: # New volume for Ghidra projects

networks:
  oghidra_net:
    driver: bridge
