version: '3.8'

services:
  oghidra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oghidra_app
    ports:
      - "8081:8081" # For ghidra_mcp_server.py
    volumes:
      - .:/app  # Mount current directory to /app for live code changes
      - oghidra_data:/app/data # Persist data generated by the application
    env_file:
      - .env # Use variables from .env file
    depends_on:
      - ollama
    networks:
      - oghidra_net
    # Default command is already set in Dockerfile (CMD ["python", "src/ghidra_mcp_server.py"])

  ollama:
    image: ollama/ollama
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama # Persist Ollama models
    networks:
      - oghidra_net

volumes:
  ollama_data:
  oghidra_data:

networks:
  oghidra_net:
    driver: bridge
